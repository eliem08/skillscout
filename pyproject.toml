[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-g2"
version = "0.1.0"
description = "G2 for skills: find the best skills for your agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
skill-g2 = "skill_g2.__main__:main"

[tool.setuptools]
packages = ["skill_g2"]
